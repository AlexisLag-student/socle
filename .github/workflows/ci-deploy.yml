name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-deploy:
    # Version fixe : ubuntu-latest bascule sur Ubuntu 26 (oct. 2026).
    runs-on: ubuntu-24.04
    # Image officielle Playwright : navigateurs et dépendances système déjà installés, plus aucun téléchargement
    # (l'installation en CI échouait par intermittence). Son numéro suit @playwright/test, vérifié plus bas.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run validate:content
      - run: npm test
      - run: npm run build
      - name: Playwright version matches the container image
        run: |
          v=$(node -p "require('@playwright/test/package.json').version")
          if [ "$v" != "1.64.1" ]; then
            echo "::error::@playwright/test $v : mettre l'image du conteneur à mcr.microsoft.com/playwright:v$v-noble"
            exit 1
          fi
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Deploy to Vercel (production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::Secrets Vercel absents : déploiement ignoré (voir README, section Déployer)."
            exit 0
          fi
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
