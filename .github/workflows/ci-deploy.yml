name: CI & Deploy

on:
  push:
    branches: [main]
    # Un push sur main ne fait que tester ; seul le tag d'une version publiée (npm run release) déploie.
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Un déploiement commencé va jusqu'au bout.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test-build-deploy:
    # Version fixe : ubuntu-latest bascule sur Ubuntu 26 (oct. 2026).
    runs-on: ubuntu-24.04
    # Image officielle Playwright : navigateurs et dépendances système déjà installés, plus aucun téléchargement
    # (l'installation en CI échouait par intermittence). Son numéro suit @playwright/test, vérifié plus bas.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Historique complet : le contrôle du tag vérifie que son commit est sur main.
          fetch-depth: 0
      - name: Release tag matches package.json and is on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, mais package.json est en $v : publier avec npm run release"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Le commit du tag $GITHUB_REF_NAME n'est pas sur main : pousser main avec le tag"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run validate:content
      - run: npm test
      - run: npm run build
      - name: Playwright version matches the container image
        run: |
          v=$(node -p "require('@playwright/test/package.json').version")
          if [ "$v" != "1.64.1" ]; then
            echo "::error::@playwright/test $v : mettre l'image du conteneur à mcr.microsoft.com/playwright:v$v-noble"
            exit 1
          fi
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Deploy to Vercel (production)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::Secrets Vercel absents : déploiement ignoré (voir README, section Déployer)."
            exit 0
          fi
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
