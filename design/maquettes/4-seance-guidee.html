<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Socle – Séance guidée</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;family=Caveat:wght@500;700&amp;family=Zilla+Slab:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F2A5C}a:hover{color:#B22A33}
.paper{background-color:#FBFAF6;background-image:linear-gradient(to right,transparent 43px,#E0565B 43px,#E0565B 45px,transparent 45px),repeating-linear-gradient(to bottom,transparent 0 31px,#BCCDE6 31px 32px),repeating-linear-gradient(to bottom,transparent 0 7px,#E6ECF6 7px 8px)}
</style>
</head>
<body>
<div class="paper" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; color: #22252B; display: flex; flex-direction: column">

<header style="padding: 18px 22px 0 60px; display: flex; align-items: center; justify-content: space-between">
<a href="2-programme.html" aria-label="Quitter la séance" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: flex-start; color: #1F2A5C"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
<span style="font-size: 14px; color: #5A6070">Exercice 3 sur 6</span>
<div role="progressbar" aria-label="Progression de la séance" aria-valuenow="3" aria-valuemin="0" aria-valuemax="6" style="display: flex; gap: 4px">
<span style="width: 12px; height: 6px; background: #1F2A5C"></span><span style="width: 12px; height: 6px; background: #1F2A5C"></span><span style="width: 12px; height: 6px; background: #B22A33"></span><span style="width: 12px; height: 6px; border: 1.5px solid #1F2A5C; box-sizing: border-box"></span><span style="width: 12px; height: 6px; border: 1.5px solid #1F2A5C; box-sizing: border-box"></span><span style="width: 12px; height: 6px; border: 1.5px solid #1F2A5C; box-sizing: border-box"></span>
</div>
</header>

<main style="flex: 1; padding: 14px 22px 0 60px; display: flex; flex-direction: column">
<h1 style="margin: 0; font-family: 'Zilla Slab', serif; font-weight: 700; font-size: 28px; line-height: 32px; color: #1F2A5C">Descente excentrique du talon</h1>
<p style="margin: 0; font-size: 15px; line-height: 32px; color: #3A3F4B">Jambe droite · genou tendu</p>

<section aria-label="Minuteur" style="margin-top: 16px; background: #FFFFFF; border: 2px solid #1F2A5C; border-radius: 4px; box-shadow: 4px 4px 0 #1F2A5C; padding: 18px 16px 16px; display: flex; flex-direction: column; align-items: center; gap: 6px">
<span style="font-family: 'Zilla Slab', serif; font-weight: 600; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #B22A33">Descendez</span>
<span style="font-family: 'Zilla Slab', serif; font-weight: 700; font-size: 96px; line-height: 96px; color: #1F2A5C; font-variant-numeric: tabular-nums">2</span>
<div aria-hidden="true" style="width: 100%; display: grid; grid-template-columns: 1fr 1fr 3fr; gap: 4px; margin-top: 6px">
<div style="height: 10px; background: #1F2A5C"></div>
<div style="height: 10px; background: #1F2A5C"></div>
<div style="height: 10px; background: linear-gradient(to right, #B22A33 0 66%, #F1D5D7 66% 100%)"></div>
</div>
<div style="width: 100%; display: grid; grid-template-columns: 1fr 1fr 3fr; gap: 4px; font-size: 12px; color: #5A6070">
<span>monter</span><span>tenir</span><span style="color: #B22A33; font-weight: 700">descendre 3 s</span>
</div>
<p style="margin: 10px 0 0; font-family: 'Caveat', cursive; font-size: 30px; line-height: 30px; color: #1F2A5C">répétition 9 / 15</p>
</section>

<div style="margin-top: 22px; display: flex; justify-content: space-between; align-items: center">
<h2 style="margin: 0; font-family: 'Zilla Slab', serif; font-weight: 700; font-size: 19px; color: #1F2A5C">Séries</h2>
<span style="font-family: 'Caveat', cursive; font-size: 22px; color: #1F2A5C">charge : poids du corps</span>
</div>
<ul style="list-style: none; margin: 8px 0 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<li style="height: 56px; border: 2px solid #1F2A5C; border-radius: 4px; background: #1F2A5C; color: #FBFAF6; display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 700"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>Série 1</li>
<li style="height: 56px; border: 2px solid #B22A33; border-radius: 4px; background: #FFFFFF; color: #B22A33; display: flex; align-items: center; justify-content: center; font-weight: 700">Série 2</li>
<li style="height: 56px; border: 2px dashed #8A90A0; border-radius: 4px; color: #5A6070; display: flex; align-items: center; justify-content: center">Série 3</li>
</ul>

<fieldset style="margin: 24px 0 0; padding: 0; border: none">
<legend style="padding: 0; font-family: 'Zilla Slab', serif; font-weight: 700; font-size: 19px; line-height: 32px; color: #1F2A5C">Comment c'était ?</legend>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<button type="button" style="height: 52px; border: 2px solid #1F2A5C; background: #FFFFFF; border-radius: 4px; font-family: 'Atkinson Hyperlegible', sans-serif; font-size: 15px; font-weight: 700; color: #1F2A5C">Facile</button>
<button type="button" style="height: 52px; border: 2px solid #1F2A5C; background: #FFFFFF; border-radius: 4px; font-family: 'Atkinson Hyperlegible', sans-serif; font-size: 15px; font-weight: 700; color: #1F2A5C">Correct</button>
<button type="button" style="height: 52px; border: 2px solid #1F2A5C; background: #FFFFFF; border-radius: 4px; font-family: 'Atkinson Hyperlegible', sans-serif; font-size: 15px; font-weight: 700; color: #1F2A5C">Trop dur</button>
</div>
</fieldset>
</main>

<div style="flex: none; padding: 12px 22px 18px 60px; display: grid; grid-template-columns: 52px 1fr; gap: 10px">
<button type="button" aria-label="Mettre en pause" style="height: 52px; border: 2px solid #1F2A5C; background: #FBFAF6; border-radius: 4px; color: #1F2A5C; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14"></rect><rect x="14" y="5" width="4" height="14"></rect></svg></button>
<button type="button" style="height: 52px; border: 2px solid #1F2A5C; background: #1F2A5C; color: #FBFAF6; border-radius: 4px; font-family: 'Atkinson Hyperlegible', sans-serif; font-weight: 700; font-size: 16px; box-shadow: 4px 4px 0 #B22A33">Série terminée · repos 1 min</button>
</div>
</div>
</body>
</html>
